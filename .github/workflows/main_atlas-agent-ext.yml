# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - atlas-agent-ext

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Build with dotnet
        run: dotnet build src/AgentToAgent.Chatbot/AgentToAgent.Chatbot.csproj --configuration Release

      - name: dotnet publish
        run: dotnet publish src/AgentToAgent.Chatbot/AgentToAgent.Chatbot.csproj -c Release -o ${{env.DOTNET_ROOT}}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_D88A757F08BA4A73A83B1123A1B939CF }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_764D24901CA54B53AB63077E8BD6D49D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_5C8A0A2A70904901BDFF52386FCFE6E6 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'atlas-agent-ext'
          slot-name: 'Production'
          package: .
          # Pins the startup DLL so Oryx can't pick a stale app's runtimeconfig.json left in wwwroot.
          startup-command: 'dotnet AgentToAgent.Chatbot.dll'
          